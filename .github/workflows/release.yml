name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare release package
        run: |
          rm -rf node_modules .git .github tests
          rm -f .env .env.* auth.json
          tar \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            -czf "../afya-mtandaoni-${GITHUB_REF_NAME}.tar.gz" .
          mv "../afya-mtandaoni-${GITHUB_REF_NAME}.tar.gz" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: afya-mtandaoni-${{ github.ref_name }}
          path: afya-mtandaoni-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: afya-mtandaoni-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
